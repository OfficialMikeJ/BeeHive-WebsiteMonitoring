version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: beehive-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=beehive_db
    networks:
      - beehive-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beehive-backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=beehive_db
      - JWT_SECRET=beehive-secure-secret-key-change-in-production
      - CORS_ORIGINS=*
    depends_on:
      - mongodb
    networks:
      - beehive-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8001
    container_name: beehive-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - beehive-network

volumes:
  mongodb_data:
    driver: local

networks:
  beehive-network:
    driver: bridge
